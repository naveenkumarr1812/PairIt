<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI Window Bridge</title>

  <style>
    body {
      width: 320px;
      padding: 16px;
      margin: 0;

      font-family:
        Arial,
        sans-serif;
    }

    h2 {
      margin-top: 0;
    }

    .section {
      margin-top: 16px;
    }

    .label {
      font-size: 13px;
      font-weight: bold;

      margin-bottom: 8px;
    }

    #status {
      padding: 10px;

      border-radius: 6px;

      background: #eee;
    }

    .provider {
      display: flex;
      align-items: center;

      gap: 8px;

      padding: 10px;

      margin-bottom: 6px;

      border: 1px solid #ddd;

      border-radius: 6px;

      cursor: pointer;
    }

    .provider:hover {
      background: #f5f5f5;
    }

    button {
      width: 100%;

      padding: 10px;

      margin-top: 10px;

      cursor: pointer;
    }

    #message {
      margin-top: 10px;

      font-size: 12px;

      color: #555;
    }
  </style>
</head>

<body>

  <h2>
    AI Window Bridge
  </h2>


  <div id="status">
    Checking...
  </div>


  <div class="section">

    <div class="label">
      Active Provider
    </div>


    <label class="provider">

      <input
        type="radio"
        name="provider"
        value="chatgpt"
      >

      ChatGPT

    </label>


    <label class="provider">

      <input
        type="radio"
        name="provider"
        value="claude"
      >

      Claude

    </label>


    <label class="provider">

      <input
        type="radio"
        name="provider"
        value="gemini"
      >

      Gemini

    </label>


    <button id="saveBtn">
      Save Provider
    </button>

  </div>


  <div id="message"></div>


  <script src="popup.js"></script>

</body>

</html>
