[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairit"
version = "0.4.1"
description = "PairIt – Your Code. Your Browser. Your AI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Naveen Kumar" },
]
keywords = ["pairit", "PairIt", "ai", "browser", "bridge", "router", "chrome-extension"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.9,<4",
]

[project.urls]
Homepage = "https://github.com/naveenkumarr1812/PairIt"
Repository = "https://github.com/naveenkumarr1812/PairIt"
Issues = "https://github.com/naveenkumarr1812/PairIt/issues"

[tool.setuptools.packages.find]
include = ["pairit*", "pair*"]
