[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-router"
version = "0.3.10"
description = "Turn your browser AI sessions into a local development interface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Naveen Kumar" },
]
keywords = ["ai", "chatgpt", "claude", "gemini", "browser", "bridge", "router", "chrome-extension"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.9,<4",
]

[project.urls]
Homepage = "https://github.com/naveenkumarr1812/Personal-AI-Router"
Repository = "https://github.com/naveenkumarr1812/Personal-AI-Router"
Issues = "https://github.com/naveenkumarr1812/Personal-AI-Router/issues"

[tool.setuptools.packages.find]
include = ["pair*"]
